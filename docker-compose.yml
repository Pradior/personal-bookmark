# ============================================================================
#  个人bookmark —— Docker 编排
#
#  ── 从 GitHub 部署（推荐）──────────────────────────────────────────────
#    git clone https://github.com/Pradior/personal-bookmark.git
#    cd personal-bookmark
#    cp .env.example .env && vi .env      # 填 DB_PASSWORD / AUTH_SECRET / WEB_PORT
#    mkdir -p data/{db,assets,config}
#    docker compose up -d --build
#
#  ── 日常更新 ──────────────────────────────────────────────────────────
#    git pull && docker compose up -d --build
#    建议先在 GitHub → Actions 确认那次提交是绿的，再 pull。
#
#  ── 本地开发 ──────────────────────────────────────────────────────────
#    docker compose up -d pb-db           # 只起数据库，web/worker 用 pnpm dev
#
#  ── 数据 ──────────────────────────────────────────────────────────────
#    全在 ./data 下：db / assets / config（含管理员密码哈希）
#    ⚠ 删项目目录 = 连数据一起删。要保留就先把 data/ 备份出去。
# ============================================================================

name: personal-bookmark

# 统一日志上限，避免 NAS 上日志把盘写满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Postgres + pgvector ──────────────────────────────────────────────
  # 不映射宿主端口：只在 compose 内部网络可达，少一个攻击面
  pb-db:
    image: pgvector/pgvector:pg16
    container_name: pb-db
    environment:
      POSTGRES_DB: bookmark
      POSTGRES_USER: bookmark
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    # 按 16GB 内存的机器调参；小内存机器把 shared_buffers 降到 256MB
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c max_connections=50
      -c work_mem=16MB
      -c timezone=Asia/Shanghai
    volumes:
      - ./data/db:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmark -d bookmark"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  # ── Next.js：界面 + /api/v1 ──────────────────────────────────────────
  pb-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: ${IMAGE_PREFIX:-pb}/web:${TAG:-local}
    container_name: pb-web
    init: true
    environment:
      DATABASE_URL: postgres://bookmark:${DB_PASSWORD}@pb-db:5432/bookmark
      APP_NAME: ${APP_NAME:-个人bookmark}
      APP_SHORT: ${APP_SHORT:-pb}
      ASSETS_DIR: /data/assets
      CONFIG_DIR: /data/config
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 里设置 AUTH_SECRET}
      # 留空 = 首启随机生成并打印到日志
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # PWA 安装与分享链接依赖它，配好 HTTPS 后改成实际地址
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # 启动时自动跑迁移；想手动控制就设 false
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      MAX_HTML_BYTES: ${MAX_HTML_BYTES:-8388608}
      MAX_SOURCE_BYTES: ${MAX_SOURCE_BYTES:-33554432}
      SOURCE_FETCH_TIMEOUT_MS: ${SOURCE_FETCH_TIMEOUT_MS:-15000}
      SOURCE_CACHE_ITEMS: ${SOURCE_CACHE_ITEMS:-50}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 宿主端口避开 80 / 443（NAS 系统 Web UI 占用）
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./data/assets:/data/assets
      - ./data/config:/data/config
    depends_on:
      pb-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      # 首启要跑数据库迁移，给足冷启动时间
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  # ── Worker：抓取 / 转码 / 分词 / 向量 / 分类 ─────────────────────────
  # 队列用 pg-boss，表就在同一个 Postgres 里，不需要 Redis
  pb-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    image: ${IMAGE_PREFIX:-pb}/worker:${TAG:-local}
    container_name: pb-worker
    init: true
    environment:
      DATABASE_URL: postgres://bookmark:${DB_PASSWORD}@pb-db:5432/bookmark
      APP_NAME: ${APP_NAME:-个人bookmark}
      APP_SHORT: ${APP_SHORT:-pb}
      ASSETS_DIR: /data/assets
      CONFIG_DIR: /data/config
      # N100 四核，3 足够；太大反而跟 web 抢 CPU
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      DISPLAY_MAX_EDGE: ${DISPLAY_MAX_EDGE:-2000}
      DISPLAY_WEBP_QUALITY: ${DISPLAY_WEBP_QUALITY:-85}
      MAX_ASSET_BYTES: ${MAX_ASSET_BYTES:-20971520}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-20000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/assets:/data/assets
      - ./data/config:/data/config
    depends_on:
      pb-db:
        condition: service_healthy
    # 让正在处理的抓取任务有机会收尾
    stop_grace_period: 30s
    logging: *default-logging
    restart: unless-stopped

# ============================================================================
#  备注
#
#  1) 为什么 web / worker 的环境变量写了两遍
#     YAML 锚点合并（<<: *app-env）在 compose v2 上能用，但在某些环境下
#     environment: 里的合并键会静默失效，排查起来很痛苦。宁可重复 6 行。
#
#  2) 文件权限
#     默认容器以 root 运行，./data 下文件属主是 root。想让 NAS 账号可读写：
#         id                              # 记下 uid:gid，绿联常见 1000:1000
#         sudo chown -R 1000:1000 data
#     然后给 pb-web / pb-worker 各加一行：user: "1000:1000"
#     ⚠ 别一上来就加：uid 填错容器起不来，报错还很不直观。
#
#  3) 构建耗时
#     N100 上首次 --build 约 10–20 分钟。之后只改业务代码，pnpm 依赖层有缓存
#     会快很多。想彻底跳过构建：把镜像推到 registry 后，删掉 build: 段、
#     把 image: 换成 ghcr.io/pradior/personal-bookmark-web:${TAG} 之类。
#
#  4) 备份
#         docker compose exec -T pb-db pg_dump -U bookmark -Fc bookmark \
#           > backup/db-$(date +%F).dump
#         tar czf backup/assets-$(date +%F).tar.gz -C data assets
#     data/db 不能热备，必须先 pg_dump。
# ============================================================================
