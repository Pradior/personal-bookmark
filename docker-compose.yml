# ============================================================================
#  个人bookmark —— Docker 编排
#
#  本地开发（只起数据库，web/worker 用 pnpm dev 跑）：
#      docker compose up -d pb-db
#
#  完整部署（在 NAS 或任意装了 Docker 的机器上，从源码构建）：
#      cp .env.example .env && 编辑 .env
#      docker compose up -d --build
#
#  常用：
#      docker compose logs -f pb-web          看 web 日志（首启密码在这里）
#      docker compose logs -f pb-worker       看抓取/转码任务日志
#      docker compose down                    停止（保留数据）
#      docker compose up -d --build           改代码后重建
#
#  数据全在 ./data 下，备份就是打包这一个目录。
# ============================================================================

name: personal-bookmark

# 统一日志上限，避免 NAS 上日志把盘写满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Postgres + pgvector ──────────────────────────────────────────────
  # 不映射宿主端口：只在 compose 内部网络可达，少一个攻击面
  pb-db:
    image: pgvector/pgvector:pg16
    container_name: pb-db
    environment:
      POSTGRES_DB: bookmark
      POSTGRES_USER: bookmark
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    # 按 16GB 内存的机器调参；小内存机器可把 shared_buffers 降到 256MB
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c max_connections=50
      -c work_mem=16MB
      -c timezone=Asia/Shanghai
    volumes:
      - ./data/db:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmark -d bookmark"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  # ── Next.js：界面 + /api/v1 ──────────────────────────────────────────
  pb-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: ${IMAGE_PREFIX:-pb}/web:${TAG:-local}
    container_name: pb-web
    init: true
    environment:
      DATABASE_URL: postgres://bookmark:${DB_PASSWORD}@pb-db:5432/bookmark
      APP_NAME: ${APP_NAME:-个人bookmark}
      APP_SHORT: ${APP_SHORT:-pb}
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 里设置 AUTH_SECRET}
      # 留空则首启随机生成并打印到日志；填了就优先用它
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ASSETS_DIR: /data/assets
      CONFIG_DIR: /data/config
      # PWA 安装与分享链接依赖它，建议填实际的 https 地址
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # 启动时自动跑迁移；想手动控制就设 false
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      MAX_HTML_BYTES: ${MAX_HTML_BYTES:-8388608}
      MAX_SOURCE_BYTES: ${MAX_SOURCE_BYTES:-33554432}
      SOURCE_FETCH_TIMEOUT_MS: ${SOURCE_FETCH_TIMEOUT_MS:-15000}
      SOURCE_CACHE_ITEMS: ${SOURCE_CACHE_ITEMS:-50}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 宿主机端口：绿联/群晖上避开 80、443（系统 Web UI 占用）
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./data/assets:/data/assets
      - ./data/config:/data/config
    depends_on:
      pb-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  # ── Worker：抓取 / 转码 / 分词 / 向量 / 分类 ─────────────────────────
  # 用 pg-boss，队列表就在同一个 Postgres 里，不需要 Redis
  pb-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    image: ${IMAGE_PREFIX:-pb}/worker:${TAG:-local}
    container_name: pb-worker
    init: true
    environment:
      DATABASE_URL: postgres://bookmark:${DB_PASSWORD}@pb-db:5432/bookmark
      APP_SHORT: ${APP_SHORT:-pb}
      ASSETS_DIR: /data/assets
      CONFIG_DIR: /data/config
      # N100 四核，3 足够；别设太大，会跟 web 抢 CPU
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      DISPLAY_MAX_EDGE: ${DISPLAY_MAX_EDGE:-2000}
      DISPLAY_WEBP_QUALITY: ${DISPLAY_WEBP_QUALITY:-85}
      MAX_ASSET_BYTES: ${MAX_ASSET_BYTES:-20971520}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-20000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/assets:/data/assets
      - ./data/config:/data/config
    depends_on:
      pb-db:
        condition: service_healthy
    # 让正在处理的抓取任务有机会收尾
    stop_grace_period: 30s
    logging: *default-logging
    restart: unless-stopped

# ============================================================================
#  备注
#
#  1) 文件权限
#     默认容器以 root 运行，./data 下的文件属主是 root。若希望归 NAS 账号所有
#     （方便 File Station / Hyper Backup 访问），在 NAS 上执行：
#         id                                   # 记下 uid/gid，例如 1000
#         sudo chown -R 1000:1000 data
#     然后给 pb-web / pb-worker 各加一行（数值换成你的）：
#         user: "1000:1000"
#
#  2) 无头浏览器（可选，Sprint 2 之后才需要）
#     抓动态页/截图时才用，默认不启。启用方式：
#         docker compose --profile browser up -d
#     目前镜像里还没有浏览器服务端代码，先留占位。
#
#  3) 用预构建镜像（等你把镜像推到 registry 之后）
#     删掉 build: 段，把 image: 换成完整地址即可，例如：
#         image: ghcr.io/your-name/personal-bookmark-web:${TAG:-latest}
#
#  4) 备份
#         docker compose exec -T pb-db pg_dump -U bookmark -Fc bookmark \
#           > backup/db-$(date +%F).dump
#         tar czf backup/assets-$(date +%F).tar.gz -C data assets
#     db 目录不能热备，必须先 pg_dump。
# ============================================================================
