name: CI

# 两个 job：
#   verify —— 类型检查 + 三套自检 + compose 校验 + Web 构建
#   images —— 构建 web / worker 镜像并推到 GHCR（只在 main 且 verify 通过后）
#
# 目的：NAS 上不再需要源码和 docker build，只 pull 镜像即可。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一次未跑完的，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / self-check / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 顺序很重要：先让 pnpm 可用，后面才能缓存它的 store
      - name: 启用 pnpm（按 packageManager 字段的版本）
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version

      - name: 缓存 pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: 安装依赖
        # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败
        run: pnpm install --frozen-lockfile

      - name: 类型检查（5 个包）
        run: pnpm -r typecheck

      - name: 自检：URL 规范化
        run: pnpm --filter @pb/core check

      - name: 自检：公众号解析与清洗
        run: pnpm --filter @pb/core check:wechat

      - name: 自检：小红书解析
        run: pnpm --filter @pb/core check:xhs

      - name: 校验 docker-compose 与 Dockerfile
        run: pnpm check:compose

      - name: 构建 Web
        run: pnpm --filter @pb/web build
        env:
          # 构建期不需要真实数据库；给个占位值避免误连
          DATABASE_URL: postgres://bookmark:build@127.0.0.1:5432/bookmark
          AUTH_SECRET: ci-build-only-secret-not-used-at-build-time
          NEXT_TELEMETRY_DISABLED: 1

  images:
    name: build & push images
    # 只有 main 上的提交才发布；PR 里只 verify 不推镜像
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            image: personal-bookmark-web
          - target: worker
            image: personal-bookmark-worker

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # GHCR 的镜像名必须全小写，而 GitHub 用户名可能带大写（Pradior）
      - name: 计算小写 owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 构建并推送（${{ matrix.target }}）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          # NAS 是 Intel N100（amd64）。要支持 ARM 就加 linux/arm64，
          # 但构建时间翻倍，且 sharp 需要对应的预编译二进制。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: 输出摘要
        run: |
          {
            echo "### ${{ matrix.target }} 镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
