name: CI

# 两个 job：
#   verify —— 类型检查 + 三套自检 + compose 校验 + Web 构建
#   images —— 构建 web / worker 镜像并推到 GHCR（只在 main 且 verify 通过后）
#
# 目的：NAS 上不再需要源码和 docker build，只 pull 镜像即可。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一次未跑完的，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / self-check / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 顺序很重要：先让 pnpm 可用，后面才能缓存它的 store
      - name: 启用 pnpm（按 packageManager 字段的版本）
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version

      - name: 缓存 pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: 安装依赖
        # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败
        run: pnpm install --frozen-lockfile

      - name: 类型检查（5 个包）
        run: pnpm -r typecheck

      - name: 自检：URL 规范化
        run: pnpm --filter @pb/core check

      - name: 自检：公众号解析与清洗
        run: pnpm --filter @pb/core check:wechat

      - name: 自检：小红书解析
        run: pnpm --filter @pb/core check:xhs

      - name: 自检：抖音解析
        run: pnpm --filter @pb/core check:douyin

      - name: 自检：站点凭据加解密
        run: pnpm --filter @pb/core check:credential

      - name: 自检：客户端提示合并
        run: pnpm --filter @pb/core check:hints

      - name: 校验 docker-compose 与 Dockerfile
        run: pnpm check:compose

      - name: 校验浏览器扩展（manifest / 脚本语法）
        run: pnpm check:ext

      - name: 构建 Web
        run: pnpm --filter @pb/web build
        env:
          # 构建期不需要真实数据库；给个占位值避免误连
          DATABASE_URL: postgres://bookmark:build@127.0.0.1:5432/bookmark
          AUTH_SECRET: ci-build-only-secret-not-used-at-build-time
          NEXT_TELEMETRY_DISABLED: 1

  images:
    name: build & push images
    # 只有 main 上的提交才发布；PR 里只 verify 不推镜像
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            image: personal-bookmark-web
          - target: worker
            image: personal-bookmark-worker

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # GHCR 的镜像名必须全小写，而 GitHub 用户名可能带大写（Pradior）
      - name: 计算小写 owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 构建并推送（${{ matrix.target }}）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          # NAS 是 Intel N100（amd64）。要支持 ARM 就加 linux/arm64，
          # 但构建时间翻倍，且 sharp 需要对应的预编译二进制。
          platforms: linux/amd64
          push: true
          # worker 要在本地跑一次冒烟测试，所以载入本地镜像
          load: ${{ matrix.target == 'worker' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # 防的是一类很贵的坑：镜像构建成功、但容器一起来就崩。
      # 比如 worker 曾用 --experimental-strip-types 启动，而 workspace 包内部
      # 是无扩展名导入，构建能过、运行时 MODULE_NOT_FOUND，任务全卡在 queued。
      # 不设 DATABASE_URL，断言它走到"未设置"的检查才退出 —— 这说明入口真的加载了。
      - name: 冒烟测试 worker 入口
        if: matrix.target == 'worker'
        run: |
          set +e
          out=$(docker run --rm -e DATABASE_URL= "${IMAGE}" 2>&1)
          code=$?
          echo "$out"
          echo "---"
          if printf '%s' "$out" | grep -qE 'MODULE_NOT_FOUND|Cannot find module|ERR_MODULE'; then
            echo "❌ worker 入口加载失败（模块解析问题）"
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "❌ 期望非零退出，实际退出码 0"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'DATABASE_URL'; then
            echo "❌ 没有走到 DATABASE_URL 检查，说明入口没真正跑起来"
            exit 1
          fi
          echo "✅ worker 入口可加载"
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest

      - name: 输出摘要
        run: |
          {
            echo "### ${{ matrix.target }} 镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
